name: Release Opencode Config

on:
  push:
    branches: [ main ]
    paths:
      - '.opencode/**'
      - 'install-opencode.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Package .opencode
        run: |
          # Create tar.gz of .opencode directory
          tar -czf opencode-config.tar.gz .opencode/
          
          # Also create a zip for Windows users
          zip -r opencode-config.zip .opencode/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Opencode Config
          body: |
            Latest AgentHarmony .opencode configuration
            
            ## Install in any project:
            
            ### Quick Install (Linux/macOS):
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
            ```
            
            ### Manual Download:
            ```bash
            # Download and extract
            curl -fsSL -o opencode-config.tar.gz https://github.com/${{ github.repository }}/releases/latest/download/opencode-config.tar.gz
            tar -xzf opencode-config.tar.gz
            rm opencode-config.tar.gz
            ```
          files: |
            opencode-config.tar.gz
            opencode-config.zip
            install-opencode.sh
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
